name: ClaudeWatchOS
options:
  bundleIdPrefix: com.johntenno
  deploymentTarget:
    watchOS: "11.0"
targets:
  ClaudeWatchOS:
    type: application
    platform: watchOS
    sources: [ClaudeWatchOS]
    info:
      path: ClaudeWatchOS/Info.plist
      properties:
        CFBundleDisplayName: claude-watchOS
        WKApplication: true
        WKWatchOnly: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johntenno.claudewatchos
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
